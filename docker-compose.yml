version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: eventflow-postgres
    environment:
      POSTGRES_DB: eventflow
      POSTGRES_USER: eventflow_user
      POSTGRES_PASSWORD: eventflow_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: eventflow-redis
    command: redis-server --requirepass redis_pass
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: eventflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: eventflow-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  backend:
    build: ./backend
    container_name: eventflow-backend
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventflow
      SPRING_DATASOURCE_USERNAME: eventflow_user
      SPRING_DATASOURCE_PASSWORD: eventflow_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: redis_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: change-this-development-secret-change-this-development-secret
      MAIL_USERNAME: ${MAIL_USERNAME:-local@example.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-local}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      TICKET_MAIL_ENABLED: ${TICKET_MAIL_ENABLED:-false}
      TICKET_MAIL_FROM: ${TICKET_MAIL_FROM:-no-reply@eventflow.local}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_local}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-local_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_DEMO: ${RAZORPAY_DEMO:-false}
      APP_AUTH_ALLOW_ROLE_REGISTRATION: ${APP_AUTH_ALLOW_ROLE_REGISTRATION:-false}
      AWS_ACCESS_KEY: local
      AWS_SECRET_KEY: local

  frontend:
    build: ./frontend
    container_name: eventflow-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
